<title>AUTOMAT - PREPARAÇAO INTELIGENTE</title>
<style>
  :root {
    --bg: #f4f5f7;
    --surface: #ffffff;
    --surface2: #f0f5f5;
    --border: #d5dbe0;
    --accent: #007E7A;
    --accent-bg: #e0f5f3;
    --orange: #EE6F16;
    --orange-bg: #fef1e6;
    --green: #1a6b1a;
    --text: #1a1d23;
    --text2: #555555;
    --text3: #8b95a1;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  html { min-height: 100%; background: var(--bg); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    background: var(--bg); color: var(--text); margin: 0; overflow-x: hidden;
    min-height: 100vh; min-height: 100dvh;
    display: flex; flex-direction: column;
  }
  header {
    background: #fff; border-bottom: 1px solid var(--border);
    padding: 14px 24px; display: flex; align-items: center; gap: 14px;
    position: sticky; top: 0; z-index: 10;
  }
  header img { height: 34px; }
  header .titulo { font-size: 18px; font-weight: 700; color: var(--text); }
  header .subtitulo { font-size: 11.5px; color: var(--text2); margin-top: 1px; }
  header .direita { margin-left: auto; display: flex; align-items: center; gap: 10px; }

  main { width: 100%; max-width: 1320px; margin: 0 auto; padding: 20px 24px 60px; flex: 1 0 auto; }

  .barra-controles {
    position: relative; display: flex; align-items: center; gap: 10px; margin-bottom: 22px; flex-wrap: wrap;
  }
  select, button, input {
    font-family: inherit; font-size: 13px; border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 12px; background: #fff; color: var(--text);
  }
  select, button { cursor: pointer; }
  .barra-controles select { min-width: 0; max-width: 100%; }
  #sel-semana { flex: 1 1 200px; min-width: 150px; }
  #sel-supervisao { flex: 1 1 180px; min-width: 150px; }
  #sel-planta { flex: 1 1 150px; min-width: 120px; }
  #sel-pcm { flex: 1 1 150px; min-width: 120px; }
  #sel-solicitante { flex: 1 1 180px; min-width: 150px; }
  #sel-status { flex: 1 1 150px; min-width: 120px; }
  .busca-ordem-filtro { flex: 1 1 200px; min-width: 150px; }
  .busca-ordem-campo { position: relative; }
  .busca-ordem-campo input {
    width: 100%; min-height: 35px; padding: 8px 40px 8px 36px; font-size: 14px;
    border-color: var(--border); transition: border-color .16s, box-shadow .16s;
  }
  .busca-ordem-campo input:focus { outline: 0; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0,126,122,.11); }
  .busca-ordem-icone {
    position: absolute; left: 12px; top: 50%; width: 16px; height: 16px;
    transform: translateY(-50%); color: var(--accent); pointer-events: none;
  }
  .busca-ordem-limpar {
    position: absolute; right: 5px; top: 50%; transform: translateY(-50%);
    width: 30px; height: 30px; padding: 0; border: 0; border-radius: 7px;
    background: transparent; color: var(--text2); font-size: 19px; line-height: 1;
  }
  .busca-ordem-limpar:hover { background: var(--surface2); }
  .sugestoes-ordem-filtro {
    position: absolute; top: calc(100% + 6px); left: 0; right: 0; z-index: 30;
    padding: 6px; background: #fff; border: 1px solid var(--border); border-radius: 10px;
    box-shadow: 0 12px 30px rgba(20,40,50,.16);
  }
  .sugestao-ordem-filtro {
    width: 100%; padding: 9px 10px; border: 0; border-radius: 7px; display: block;
    background: transparent; text-align: left; color: var(--text);
  }
  .sugestao-ordem-filtro:hover, .sugestao-ordem-filtro:focus { outline: 0; background: var(--accent-bg); }
  .sugestao-ordem-filtro strong { display: block; font-size: 14px; }
  .sugestao-ordem-filtro span { display: block; margin-top: 2px; color: var(--text2); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sugestao-ordem-vazia { padding: 10px; color: var(--text2); font-size: 12px; }
  .btn-limpar-filtros {
    min-height: 35px; flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 8px 13px; border-color: #C0305E; background: #C0305E; color: #fff;
    font-weight: 600; white-space: nowrap; transition: background .16s, border-color .16s;
  }
  .btn-limpar-filtros:hover { background: #9F274D; border-color: #9F274D; }
  .btn-limpar-filtros:focus-visible { outline: 3px solid rgba(192,48,94,.24); outline-offset: 2px; }
  .btn-limpar-filtros svg { width: 15px; height: 15px; }
  .btn-limpar-filtros[hidden] { display: none; }
  #status-salvamento { position: absolute; top: calc(100% + 2px); right: 0; }
  button.primario { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }
  button.primario:hover { background: #00655f; }
  button:disabled { opacity: .5; cursor: default; }

  .resumo { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  .resumo .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 12px 18px; flex: 1; min-width: 140px;
  }
  .resumo .card .num { font-size: 26px; font-weight: 700; line-height: 1; }
  .resumo .card .lbl { font-size: 11.5px; color: var(--text2); margin-top: 4px; }
  .resumo .card.solicitados .num { color: var(--orange); }
  .resumo .card.em-preparacao .num { color: var(--accent); }
  .resumo .card.despachados .num { color: #6B5CC5; }
  .resumo .card.entregues .num { color: var(--green); }
  .resumo .card.atrasados .num { color: #C0305E; }
  .resumo .card.sem-responsavel .num { color: #8A5A00; }

  .barra-acoes-massa {
    margin: -4px 0 18px; padding: 11px 13px; display: flex; align-items: center;
    justify-content: space-between; gap: 14px; border: 1px solid #9fd8d3;
    border-left: 4px solid var(--accent); border-radius: var(--radius); background: var(--accent-bg);
  }
  .barra-acoes-massa[hidden] { display: none; }
  .acoes-massa-info { color: var(--accent); font-size: 13px; }
  .acoes-massa-info strong { font-size: 16px; }
  .acoes-massa-controles { display: flex; align-items: center; gap: 8px; }
  .acoes-massa-controles label { color: var(--text2); font-size: 12px; font-weight: 700; white-space: nowrap; }
  #status-em-massa { min-width: 210px; }
  #btn-aplicar-status-massa { min-height: 35px; }

  .dia-secao { margin-bottom: 22px; }
  .dia-secao .dia-titulo {
    background: var(--accent); color: #fff; padding: 9px 16px; border-radius: 8px 8px 0 0;
    font-size: 13.5px; font-weight: 700; display: flex; align-items: center; justify-content: space-between;
  }
  .dia-secao .dia-titulo .contagem { font-size: 11.5px; font-weight: 500; opacity: .9; }

  .materiais-lista {
    overflow: hidden; background: var(--surface); border: 1px solid var(--border);
    border-top: 0; border-radius: 0 0 var(--radius) var(--radius);
    box-shadow: 0 2px 8px rgba(20, 40, 50, .05);
  }
  .lista-cabecalho, .material-linha {
    display: grid;
    grid-template-columns: minmax(112px,.85fr) minmax(120px,.95fr) minmax(230px,2.2fr) minmax(180px,1.45fr) minmax(108px,.8fr) minmax(120px,.95fr) 82px 48px;
    gap: 12px; align-items: center;
  }
  .lista-cabecalho {
    min-height: 34px; padding: 7px 13px; background: #edf1f2; border-bottom: 1px solid var(--border);
    color: var(--text2); font-size: 10.5px; font-weight: 750; letter-spacing: .3px; text-transform: uppercase;
  }
  .material-linha {
    min-height: 62px; padding: 9px 13px; border-bottom: 1px solid #e8ecee;
    transition: background .15s ease, box-shadow .15s ease;
  }
  .material-linha:last-child { border-bottom: 0; }
  .material-linha:hover { position: relative; z-index: 1; background: #f8fbfb; box-shadow: inset 3px 0 0 var(--accent); }
  .material-linha.entregue { background: #fafafa; }
  .material-linha.selecionada, .material-linha.entregue.selecionada { background: #e7f7f5; box-shadow: inset 3px 0 0 var(--accent); }
  .material-linha.entregue .col-descricao { color: var(--text3); text-decoration: line-through; }
  .linha-celula { min-width: 0; color: var(--text2); font-size: 12.5px; line-height: 1.35; }
  .col-ordem { color: var(--text); font-size: 14px; font-weight: 750; overflow-wrap: anywhere; }
  .col-descricao, .col-local { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .col-data { color: var(--text); font-weight: 600; white-space: nowrap; }
  .pill-status {
    display: inline-flex; align-items: center; width: fit-content; max-width: 100%; padding: 5px 8px;
    border-radius: 999px; font-size: 10.5px; font-weight: 800; line-height: 1.2; white-space: nowrap;
  }
  .pill-status.solicitado { color: #a54a0e; background: #fff0e5; }
  .pill-status.em-preparacao { color: #006a66; background: #ddf3f1; }
  .pill-status.despachado { color: #51439f; background: #ece9ff; }
  .pill-status.entregue { color: #176d43; background: #dff4e9; }
  .col-acao { text-align: right; }
  .col-selecao { display: flex; align-items: center; justify-content: center; }
  .selecao-alvo {
    width: 34px; height: 34px; display: inline-flex; align-items: center; justify-content: center;
    border-radius: 7px; cursor: pointer;
  }
  .selecao-alvo:hover { background: rgba(0,126,122,.08); }
  .checkbox-selecao {
    width: 18px; height: 18px; margin: 0; padding: 0; border-radius: 4px;
    cursor: pointer; accent-color: var(--accent);
  }
  .checkbox-selecao:disabled { cursor: not-allowed; opacity: .35; }
  .selecao-alvo:has(.checkbox-selecao:disabled) { cursor: not-allowed; }
  .selecao-alvo:has(.checkbox-selecao:disabled):hover { background: transparent; }
  .botao-acao {
    min-width: 70px; min-height: 34px; padding: 7px 10px; border-color: var(--accent);
    color: #fff; background: var(--accent); font-size: 11px; font-weight: 750;
  }
  .botao-acao:hover { background: #00655f; }

  .material-label {
    display: block; margin-bottom: 5px; color: var(--text2); font-size: 12px;
    font-weight: 700; letter-spacing: .25px; text-transform: uppercase;
  }
  .material-valor { font-size: 14px; line-height: 1.4; overflow-wrap: anywhere; }
  .material-ordem { font-size: 16px; font-weight: 750; letter-spacing: .2px; }
  .gestao-titulo { color: var(--accent); font-size: 12px; font-weight: 750; text-transform: uppercase; letter-spacing: .35px; margin-bottom: 9px; }
  .material-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; align-items: end; }
  .gestao-campo { min-width: 0; }
  .gestao-campo.observacao { grid-column: span 2; }
  .entrega-registro {
    margin-top: 12px; padding: 12px; display: grid;
    grid-template-columns: repeat(2, minmax(150px, 1fr)) minmax(190px, auto);
    gap: 12px; align-items: end; border: 1px solid #b9dfca; border-radius: 9px; background: #eef9f3;
  }
  .entrega-registro .material-label { color: #176d43; }
  .entrega-registro .material-valor { font-weight: 650; }
  .anexo-entrega {
    min-height: 36px; padding: 7px 11px; display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    border: 1px solid #8bc5a5; border-radius: 7px; color: #176d43; background: #fff; font-weight: 700; cursor: pointer;
  }
  .anexo-entrega:disabled { cursor: wait; opacity: .65; }
  .sem-anexo { color: var(--text2); font-size: 12.5px; }

  .campo-gestao { width: 100%; min-width: 0; padding: 7px 9px; border-radius: 6px; font-size: 13px; }
  .status-select { min-width: 0; font-weight: 700; }
  .status-somente-leitura { display: flex; align-items: center; min-height: 35px; color: #176d43; background: #edf9f2; border: 1px solid #bfe4cf; font-weight: 800; }
  .status-ajuda { display: block; margin-top: 5px; color: var(--text2); font-size: 10.5px; line-height: 1.35; }
  .status-salvamento { font-size: 11.5px; color: var(--text2); min-height: 16px; }
  .status-salvamento.ok { color: var(--green); }
  .status-salvamento.erro { color: #C0305E; }
  .badge-supervisao {
    display: inline-block; background: var(--accent-bg); color: var(--accent); font-size: 10.5px;
    font-weight: 600; padding: 2px 8px; border-radius: 10px;
  }

  .painel-overlay {
    position: fixed; inset: 0; z-index: 40; display: flex; justify-content: flex-end;
    background: rgba(18,29,34,.48); backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px);
  }
  .painel-overlay[hidden] { display: none; }
  .painel-ordem {
    width: min(560px, 100%); height: 100dvh; overflow-y: auto; background: #f5f7f8;
    box-shadow: -18px 0 48px rgba(18,29,34,.2); animation: painelEntrar .22s ease-out;
  }
  @keyframes painelEntrar { from { transform: translateX(36px); opacity: .75; } }
  .painel-cabecalho {
    position: sticky; top: 0; z-index: 2; min-height: 72px; padding: 13px 18px;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    color: #fff; background: var(--accent); box-shadow: 0 2px 9px rgba(0,70,67,.16);
  }
  .painel-cabecalho small { display: block; margin-bottom: 2px; color: rgba(255,255,255,.75); font-size: 10px; font-weight: 750; letter-spacing: .5px; }
  .painel-cabecalho h2 { margin: 0; font-size: 21px; letter-spacing: .2px; overflow-wrap: anywhere; }
  .painel-fechar {
    flex: 0 0 auto; width: 40px; height: 40px; padding: 0; display: grid; place-items: center;
    border-color: rgba(255,255,255,.35); color: #fff; background: rgba(255,255,255,.12); font-size: 22px;
  }
  .painel-conteudo { padding: 16px 18px 28px; }
  .painel-status-linha {
    margin-bottom: 12px; padding: 12px 14px; display: flex; align-items: center; justify-content: space-between; gap: 12px;
    background: #fff; border: 1px solid var(--border); border-radius: var(--radius);
  }
  .painel-status-linha .data-resumo { text-align: right; }
  .painel-bloco {
    margin-top: 12px; padding: 15px; background: #fff; border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: 0 1px 3px rgba(20,40,50,.04);
  }
  .painel-bloco h3 { margin: 0 0 13px; color: var(--accent); font-size: 13px; letter-spacing: .3px; text-transform: uppercase; }
  .painel-dados { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 16px; }
  .painel-dado { min-width: 0; }
  .painel-dado.largo { grid-column: 1 / -1; }
  .painel-aviso { margin: 11px 2px 0; color: var(--text3); font-size: 11.5px; line-height: 1.45; }
  .checklist-campo { min-height: 35px; padding: 7px 9px; display: flex; align-items: center; gap: 8px; border: 1px solid var(--border); border-radius: 6px; background: #f8fbfb; font-size: 12.5px; font-weight: 700; }
  .historico-lista { display: grid; gap: 8px; }
  .historico-item { padding: 9px 10px; border-left: 3px solid var(--accent); border-radius: 5px; background: #f5f8f8; }
  .historico-item strong { display: block; font-size: 12px; }
  .historico-item span { display: block; margin-top: 2px; color: var(--text2); font-size: 11px; line-height: 1.4; }
  .ocorrencia-item { border-left-color: #c0305e; }
  body.painel-aberto { overflow: hidden; }

  @media (max-width: 1100px) {
    .barra-controles { flex-wrap: wrap; }
    .lista-cabecalho, .material-linha {
      grid-template-columns: minmax(112px,.85fr) minmax(120px,.9fr) minmax(220px,2fr) minmax(108px,.8fr) 82px 48px;
    }
    .col-local, .col-supervisao { display: none; }
  }

  @media (max-width: 780px) {
    header { padding: 12px 16px; }
    header .subtitulo { display: none; }
    main { padding: 16px 12px 48px; }
    .barra-controles { display: grid; grid-template-columns: 1fr; }
    .barra-controles select { width: 100%; min-width: 0; }
    .busca-ordem-filtro { width: 100%; min-width: 0; max-width: none; }
    .barra-acoes-massa { align-items: stretch; flex-direction: column; }
    .acoes-massa-controles { display: grid; grid-template-columns: 1fr; }
    #status-em-massa, #btn-aplicar-status-massa { width: 100%; min-width: 0; }
    .dia-secao .dia-titulo { align-items: flex-start; gap: 8px; }
    .materiais-lista { border: 0; border-radius: 0; background: transparent; box-shadow: none; }
    .lista-cabecalho { display: none; }
    .material-linha {
      min-height: 0; margin-top: 8px; padding: 12px; display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto; gap: 7px 9px;
      background: #fff; border: 1px solid var(--border); border-radius: var(--radius);
      box-shadow: 0 1px 3px rgba(20,40,50,.05);
    }
    .material-linha:last-child { border-bottom: 1px solid var(--border); }
    .material-linha:hover { box-shadow: 0 1px 3px rgba(20,40,50,.05); }
    .col-ordem { grid-column: 1; grid-row: 1; font-size: 15px; }
    .col-acao { grid-column: 2; grid-row: 1; }
    .col-selecao { grid-column: 3; grid-row: 1; }
    .col-descricao { grid-column: 1 / -1; grid-row: 2; white-space: normal; color: var(--text); }
    .col-status { grid-column: 1; grid-row: 3; }
    .col-data { grid-column: 2 / 4; grid-row: 3; align-self: center; font-size: 12px; text-align: right; }
    .col-local, .col-supervisao { display: none; }
    .material-grid { grid-template-columns: 1fr; }
    .gestao-campo.observacao { grid-column: auto; }
    .entrega-registro { grid-template-columns: 1fr; }
    .painel-ordem { width: 100%; }
    .painel-conteudo { padding: 13px 13px 24px; }
    .painel-dados { grid-template-columns: 1fr; }
    .painel-dado.largo { grid-column: auto; }
  }

  .vazio, .carregando, .erro {
    text-align: center; padding: 50px 20px; color: var(--text2); font-size: 13px;
  }
  .erro { color: #C0305E; }
  .carregando .spinner {
    display: inline-block; width: 22px; height: 22px; border: 3px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%; animation: girar 0.8s linear infinite; margin-bottom: 10px;
  }
  @keyframes girar { to { transform: rotate(360deg); } }

  footer { text-align: center; font-size: 11px; color: var(--text3); padding: 18px; }
</style>
</head>

function normalizarStatusMaterial(item) {
  const statusOriginal = String(item.status || '').trim().toUpperCase();
  const statusSemAcento = statusOriginal.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  const statusLegado = {
    'SOLICITADO': 'SOLICITADO',
    'EM_SEPARACAO': 'EM PREPARAÇÃO',
    'EM SEPARACAO': 'EM PREPARAÇÃO',
    'EM_PREPARACAO': 'EM PREPARAÇÃO',
    'EM PREPARACAO': 'EM PREPARAÇÃO',
    'SEPARADO': 'DESPACHADO',
    'DESPACHADO': 'DESPACHADO',
    'ENTREGUE': 'ENTREGUE',
    'AGUARDANDO_COMPRA': 'SOLICITADO',
    'AGUARDANDO COMPRA': 'SOLICITADO'
  };
  return statusLegado[statusSemAcento] || (item.separado ? 'DESPACHADO' : 'SOLICITADO');
}

function montarOpcoes(opcoes, selecionado) {
  return opcoes.map(([valor, rotulo]) =>
    `<option value="${valor}" ${valor === selecionado ? 'selected' : ''}>${rotulo}</option>`
  ).join('');
}

function classeStatus(status) {
  return {
    'SOLICITADO': 'solicitado',
    'EM PREPARAÇÃO': 'em-preparacao',
    'DESPACHADO': 'despachado',
    'ENTREGUE': 'entregue'
  }[status] || 'solicitado';
}

function normalizarChaveOrdem(valor) {
  const texto = String(valor == null ? '' : valor).trim().toUpperCase();
  if (!texto) return '';
  const somenteDigitos = texto.replace(/[^0-9]/g, '');
  return somenteDigitos
    ? somenteDigitos.replace(/^0+(?=\d)/, '')
    : texto.replace(/\s+/g, '');
}

function normalizarTextoFiltro(valor) {
  return String(valor == null ? '' : valor)
    .trim()
    .replace(/\s+/g, ' ')
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .toUpperCase();
}

function compararPorSupervisao(a, b) {
  const supervisaoA = String(a.supervisao || '').trim();
  const supervisaoB = String(b.supervisao || '').trim();

  // Mantém registros sem supervisão no fim da lista.
  if (!supervisaoA && supervisaoB) return 1;
  if (supervisaoA && !supervisaoB) return -1;

  const porSupervisao = supervisaoA.localeCompare(supervisaoB, 'pt-BR', {
    sensitivity: 'base',
    numeric: true
  });
  if (porSupervisao !== 0) return porSupervisao;

  const porDestino = String(a.destinoAgrupamento || a.local || '').localeCompare(String(b.destinoAgrupamento || b.local || ''), 'pt-BR', {
    sensitivity: 'base', numeric: true
  });
  if (porDestino !== 0) return porDestino;

  const prioridade = { URGENTE: 0, ALTA: 1, NORMAL: 2 };
  const porPrioridade = (prioridade[a.prioridade] ?? 3) - (prioridade[b.prioridade] ?? 3);
  if (porPrioridade !== 0) return porPrioridade;

  // Em supervisão, destino e prioridade iguais, usa a ordem como desempate estável.
  return String(a.ordem || '').localeCompare(String(b.ordem || ''), 'pt-BR', {
    sensitivity: 'base',
    numeric: true
  });
}

function chaveSelecaoItem(item) {
  return [item._semanaChave, item._pushId, item._itemIdx].join('::');
}

function sincronizarSelecoesComItensVisiveis(itens) {
  const chavesVisiveis = new Set(itens.filter(item => item.status !== 'ENTREGUE').map(chaveSelecaoItem));
  let removeuSelecao = false;
  [..._itensSelecionados].forEach(chave => {
    if (!chavesVisiveis.has(chave)) {
      _itensSelecionados.delete(chave);
      removeuSelecao = true;
    }
  });
  if (removeuSelecao) _diasSelecionadosPeloCabecalho.clear();
}

function alternarSelecaoItem(checkbox) {
  const chave = checkbox.dataset.chave;
  _diasSelecionadosPeloCabecalho.delete(checkbox.dataset.dia);
  if (checkbox.checked) _itensSelecionados.add(chave);
  else _itensSelecionados.delete(chave);
  atualizarCheckboxesSelecao();
}

function alternarSelecaoDia(checkbox) {
  const dia = checkbox.dataset.dia;
  if (checkbox.checked) _diasSelecionadosPeloCabecalho.add(dia);
  else _diasSelecionadosPeloCabecalho.delete(dia);
  _itensVisiveis
    .filter(item => (item.dataExecucao || 'sem-data') === dia && item.status !== 'ENTREGUE')
    .forEach(item => {
      const chave = chaveSelecaoItem(item);
      if (checkbox.checked) _itensSelecionados.add(chave);
      else _itensSelecionados.delete(chave);
    });
  atualizarCheckboxesSelecao();
}

function atualizarCheckboxesSelecao() {
  const caixasItens = [...document.querySelectorAll('.checkbox-selecao-item')].filter(checkbox => !checkbox.disabled);
  caixasItens.forEach(checkbox => {
    checkbox.checked = _itensSelecionados.has(checkbox.dataset.chave);
    const linha = checkbox.closest('.material-linha');
    if (linha) linha.classList.toggle('selecionada', checkbox.checked);
  });

  document.querySelectorAll('.checkbox-selecao-dia').forEach(checkbox => {
    const caixasDoDia = caixasItens.filter(caixa => caixa.dataset.dia === checkbox.dataset.dia);
    const selecionadas = caixasDoDia.filter(caixa => caixa.checked).length;
    checkbox.checked = caixasDoDia.length > 0 && selecionadas === caixasDoDia.length;
    checkbox.indeterminate = selecionadas > 0 && selecionadas < caixasDoDia.length;
  });
  atualizarBarraAcoesMassa();
}

function atualizarBarraAcoesMassa() {
  const barra = document.getElementById('barra-acoes-massa');
  const quantidade = _itensSelecionados.size;
  const deveAparecer = quantidade > 1 || _diasSelecionadosPeloCabecalho.size > 0;

  document.getElementById('qtd-selecionadas').textContent = quantidade;
  document.getElementById('rotulo-selecionadas').textContent = quantidade === 1 ? 'ordem selecionada' : 'ordens selecionadas';

  if (!deveAparecer) {
    document.getElementById('status-em-massa').value = '';

  }

async function aplicarStatusEmMassa() {
  const seletorStatus = document.getElementById('status-em-massa');
  const botao = document.getElementById('btn-aplicar-status-massa');
  const novoStatus = seletorStatus.value;
  const itens = _itensVisiveis.filter(item => item.status !== 'ENTREGUE' && _itensSelecionados.has(chaveSelecaoItem(item)));

  if (!STATUS_ALTERAVEIS_AUTOMAT.some(([status]) => status === novoStatus) || !itens.length) return;
  if (!confirm(`Alterar ${itens.length} ${itens.length === 1 ? 'ordem' : 'ordens'} para ${novoStatus}?`)) return;

  const ordemStatus = ['SOLICITADO', 'EM PREPARAÇÃO', 'DESPACHADO'];
  const existeRetorno = itens.some(item => ordemStatus.indexOf(novoStatus) < ordemStatus.indexOf(item.status));
  let justificativa = '';
  if (existeRetorno) {
    justificativa = String(prompt('Informe a justificativa para retornar o status das ordens selecionadas:') || '').trim();
    if (justificativa.length < 5) {
      alert('Para corrigir um status, informe uma justificativa com pelo menos 5 caracteres.');
      return;
    }
  }

  const separado = novoStatus === 'DESPACHADO';
  const alteracoes = {};
  itens.forEach(item => {
    const caminho = `materiais/${item._semanaChave}/${item._pushId}/itens/${item._itemIdx}`;
    const chaveHistorico = criarChaveRegistro();
    alteracoes[`${caminho}/status`] = novoStatus;
    alteracoes[`${caminho}/separado`] = separado;
    alteracoes[`${caminho}/historico/${chaveHistorico}`] = {
      acao: existeRetorno ? 'CORRECAO_STATUS' : 'STATUS_ALTERADO',
      autorNome: 'OPERADOR AUTOMAT',
      criadoEm: { '.sv': 'timestamp' },
      detalhes: { valorAnterior: item.status, valorNovo: novoStatus, justificativa }
    };
  });

  botao.disabled = true;
  seletorStatus.disabled = true;
  botao.textContent = 'Aplicando...';
  mostrarStatusSalvamento(`Atualizando ${itens.length} ${itens.length === 1 ? 'ordem' : 'ordens'}...`);

  try {
    const resposta = await _fetchFb('/.json', {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(alteracoes)
    });
    if (!resposta.ok) throw new Error('Status ' + resposta.status);

    itens.forEach(item => {
      item.status = novoStatus;
      item.separado = separado;
    });
    _itensSelecionados.clear();
    _diasSelecionadosPeloCabecalho.clear();
    fecharPainelOrdem();
    
    popularFiltrosCascata();
    
    
    
    
    renderizarSemanaSelecionada();
    mostrarStatusSalvamento(`Status atualizado em ${itens.length} ${itens.length === 1 ? 'ordem' : 'ordens'}.`, 'ok');
  } catch (erro) {
    mostrarStatusSalvamento('Falha ao atualizar os status.', 'erro');
    alert('Não foi possível atualizar as ordens selecionadas. Tente novamente.\n\nDetalhe: ' + erro.message);
  } finally {
    seletorStatus.disabled = false;
    seletorStatus.value = '';
    botao.textContent = 'Aplicar status';
    botao.disabled = true;
  }
}

function deduplicarOrdensPrimeiraData(lista) {
  const porOrdem = new Map();
  const semOrdem = [];

  lista.forEach(item => {
    const ordem = normalizarChaveOrdem(item.ordem);
    if (!ordem) {
      semOrdem.push(item);
      return;
    }

    const atual = porOrdem.get(ordem);
    const dataItem = item.dataExecucao || '9999-12-31';
    const dataAtual = atual ? (atual.dataExecucao || '9999-12-31') : '';
    const envioItem = item.enviadoEm || '9999-12-31T23:59:59.999Z';
    const envioAtual = atual ? (atual.enviadoEm || '9999-12-31T23:59:59.999Z') : '';

    if (!atual || dataItem < dataAtual || (dataItem === dataAtual && envioItem < envioAtual)) {
      porOrdem.set(ordem, item);
    }
  });

  return [...porOrdem.values(), ...semOrdem];
}

function fmtDataBR(iso) {
  if (!iso) return '-';
  const [a,m,d] = iso.split('-');
  return d + '/' + m + '/' + a;
}

function fmtDataHoraBR(valor) {
  if (!valor) return '-';
  const data = new Date(typeof valor === 'number' ? valor : String(valor));
  if (Number.isNaN(data.getTime())) return '-';
  return data.toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' });
}

function nomeDia(iso) {
  if (!iso) return 'Sem data';
  const dt = new Date(iso + 'T00:00:00');
  return DIAS_SEMANA[dt.getDay()];
}

  function alterarSemanaSelecionada() {
    atualizarFiltrosAutomat(5, document.getElementById('sel-semana').value);
  }

  function alterarStatusSelecionado() {
    atualizarFiltrosAutomat(6, document.getElementById('sel-status').value);

function atualizarSugestoesOrdem() {
  const input = document.getElementById('busca-ordem-filtro');
  const lista = document.getElementById('sugestoes-ordem-filtro');
  const termo = normalizarChaveOrdem(input.value);

  if (!termo) {
    lista.hidden = true;
    input.setAttribute('aria-expanded', 'false');
    return;
  }

  _sugestoesOrdem = obterItensDoRecorteSemBusca()
    .filter(item => normalizarChaveOrdem(item.ordem).includes(termo))
    .sort((a, b) => String(a.ordem || '').localeCompare(String(b.ordem || ''), 'pt-BR', { numeric: true }))
    .slice(0, 8);

  lista.innerHTML = _sugestoesOrdem.length
    ? _sugestoesOrdem.map((item, indice) => `
        <button class="sugestao-ordem-filtro" type="button" role="option" onclick="selecionarSugestaoOrdem(${indice})">
          <strong>${escHtml(item.ordem) || '-'}</strong>
          <span>${escHtml(item.supervisao) || 'Sem supervisão'} · ${escHtml(item.status)}</span>
        </button>
      `).join('')
    : '<div class="sugestao-ordem-vazia">Nenhuma ordem encontrada neste filtro.</div>';
  lista.hidden = false;
  input.setAttribute('aria-expanded', 'true');
}

function aplicarBuscaOrdem() {
  const input = document.getElementById('busca-ordem-filtro');
  _buscaOrdemAtual = input.value.trim();
  atualizarSugestoesOrdem();
  renderizarSemanaSelecionada();
}

function selecionarSugestaoOrdem(indice) {
  const item = _sugestoesOrdem[indice];
  if (!item) return;
  const input = document.getElementById('busca-ordem-filtro');
  input.value = item.ordem;
  _buscaOrdemAtual = item.ordem;
  document.getElementById('busca-ordem-limpar').hidden = false;
  fecharSugestoesOrdem();
  renderizarSemanaSelecionada();
}

function fecharSugestoesOrdem() {
  const input = document.getElementById('busca-ordem-filtro');
  const lista = document.getElementById('sugestoes-ordem-filtro');
  _sugestoesOrdem = [];
  lista.hidden = true;
  input.setAttribute('aria-expanded', 'false');
}

function resetarBuscaOrdem() {
  const input = document.getElementById('busca-ordem-filtro');
  input.value = '';
  _buscaOrdemAtual = '';
  document.getElementById('busca-ordem-limpar').hidden = true;
  fecharSugestoesOrdem();
}

function limparBuscaOrdem() {
  resetarBuscaOrdem();
  renderizarSemanaSelecionada();
  document.getElementById('busca-ordem-filtro').focus();
}

function limparTodosFiltros() {
  const selSemana = document.getElementById('sel-semana');
  fecharPainelOrdem();
  if (selSemana.options.length) selSemana.selectedIndex = 0;
  _semanaAtual = selSemana.value;
  _supervisaoAtual = '';
    _plantaAtual = '';
    _pcmAtual = '';
    _solicitanteAtual = '';
    _statusAtual = '';
  _itensSelecionados.clear();
  _diasSelecionadosPeloCabecalho.clear();
  resetarBuscaOrdem();
  popularFiltrosCascata();
  
  renderizarSemanaSelecionada();
}

function atualizarVisibilidadeLimparFiltros() {
  const botao = document.getElementById('btn-limpar-filtros');
  const selSemana = document.getElementById('sel-semana');
  const semanaFiltrada = Boolean(selSemana && selSemana.selectedIndex > 0);
  const possuiFiltro = semanaFiltrada || Boolean(_supervisaoAtual || _plantaAtual || _pcmAtual || _solicitanteAtual || _statusAtual || _buscaOrdemAtual);
  botao.hidden = !possuiFiltro;
}

function tratarTeclaBuscaOrdem(evento) {
  if (evento.key === 'Escape') {
    fecharSugestoesOrdem();
    return;
  }
  if (evento.key === 'Enter' && _sugestoesOrdem.length) {
    evento.preventDefault();
    selecionarSugestaoOrdem(0);
  }
}

function renderizarSemanaSelecionada() {
    if (_itemPainelAberto && _itemPainelAberto._semanaChave !== _semanaAtual) fecharPainelOrdem();
    
    const inputBusca = document.getElementById('busca-ordem-filtro');
    _buscaOrdemAtual = inputBusca ? inputBusca.value.trim() : '';
    const termoOrdem = normalizarChaveOrdem(_buscaOrdemAtual);
    
    let itens = [];
    if (termoOrdem) {
      itens = obterItensDoRecorteSemBusca().filter(item => normalizarChaveOrdem(item.ordem).includes(termoOrdem));
    } else {
      itens = obterItensDoRecorteSemBusca();
    }
    sincronizarSelecoesComItensVisiveis(itens);
  atualizarVisibilidadeLimparFiltros();
  if (_itemPainelAberto && !itens.includes(_itemPainelAberto)) fecharPainelOrdem();
  _itensVisiveis = itens;
  atualizarBarraAcoesMassa();
  const resumoEl = document.getElementById('resumo');
  const conteudoEl = document.getElementById('conteudo');

  if (!itens.length) {
    _itensVisiveis = [];
    resumoEl.style.display = 'none';
    conteudoEl.innerHTML = termoOrdem
      ? '<div class="vazio">Nenhuma ordem encontrada para esta pesquisa e os filtros selecionados.</div>'
      : _statusAtual
      ? '<div class="vazio">Nenhuma solicitação encontrada para este status na supervisão e semana selecionadas.</div>'
      : _supervisaoAtual
      ? '<div class="vazio">Nenhuma solicitação encontrada para esta supervisão na semana selecionada.</div>'
      : '<div class="vazio">Nenhuma solicitação de material encontrada.<br>Assim que um programador clicar em "Solicitar Material" no AUTOPROG, os itens aparecem aqui.</div>';
    return;
  }

  const solicitados = itens.filter(i => i.status === 'SOLICITADO').length;
  const emPreparacao = itens.filter(i => i.status === 'EM PREPARAÇÃO').length;
  const despachados = itens.filter(i => i.status === 'DESPACHADO').length;
  const entregues = itens.filter(i => i.status === 'ENTREGUE').length;
  const agora = new Date();
  const atrasados = itens.filter(i => i.status !== 'ENTREGUE' && i.prazoNecessario && new Date(`${i.prazoNecessario}T23:59:59`) < agora).length;
  const semResponsavel = itens.filter(i => i.status !== 'ENTREGUE' && !String(i.responsavel || '').trim()).length;
  resumoEl.style.display = 'flex';
  resumoEl.innerHTML = `
    <div class="card"><div class="num">${itens.length}</div><div class="lbl">Total de itens</div></div>
    <div class="card solicitados"><div class="num">${solicitados}</div><div class="lbl">Solicitados</div></div>
    <div class="card em-preparacao"><div class="num">${emPreparacao}</div><div class="lbl">Em preparação</div></div>
    <div class="card despachados"><div class="num">${despachados}</div><div class="lbl">Despachados</div></div>
    <div class="card entregues"><div class="num">${entregues}</div><div class="lbl">Entregues</div></div>
    <div class="card atrasados"><div class="num">${atrasados}</div><div class="lbl">Pendências atrasadas</div></div>
    <div class="card sem-responsavel"><div class="num">${semResponsavel}</div><div class="lbl">Sem responsável</div></div>
  `;

  // Agrupa por data de execução, mantendo uma lista compacta para grandes volumes.
  const porData = {};
  itens.forEach(item => {
    const data = item.dataExecucao || 'sem-data';
    if (!porData[data]) porData[data] = [];
    porData[data].push(item);
  });
  Object.values(porData).forEach(linhas => linhas.sort(compararPorSupervisao));
  const datasOrdenadas = Object.keys(porData).sort();
  const indicePorItem = new Map(itens.map((item, indice) => [item, indice]));

  conteudoEl.innerHTML = datasOrdenadas.map(data => {
    const linhas = porData[data];
    const pendentesNoDia = linhas.filter(i => i.status !== 'ENTREGUE').length;
    return `
      <section class="dia-secao">
        <div class="dia-titulo">
          <span>${data === 'sem-data' ? 'Sem data definida' : nomeDia(data) + ' - ' + fmtDataBR(data)}</span>
          <span class="contagem">${linhas.length} item(ns)${pendentesNoDia>0 ? ' · '+pendentesNoDia+' pendente(s)' : ' · tudo entregue ✓'}</span>
        </div>
        <div class="materiais-lista" role="table" aria-label="Ordens de ${data === 'sem-data' ? 'data não definida' : fmtDataBR(data)}">
          <div class="lista-cabecalho" role="row">

            <span class="col-selecao" role="columnheader">
              <label class="selecao-alvo" title="${pendentesNoDia ? 'Selecionar todas as ordens não entregues deste dia' : 'Todas as ordens deste dia já foram entregues'}">
                <input class="checkbox-selecao checkbox-selecao-dia" type="checkbox" data-dia="${escHtml(data)}" onchange="alternarSelecaoDia(this)" aria-label="Selecionar todas as ordens não entregues de ${data === 'sem-data' ? 'data não definida' : fmtDataBR(data)}" ${pendentesNoDia ? '' : 'disabled'}>
              </label>
            </span>
          </div>
          ${linhas.map(item => {
            const indiceItem = indicePorItem.get(item);
            const chaveSelecao = chaveSelecaoItem(item);

            return `
              <article class="material-linha ${item.status === 'ENTREGUE' ? 'entregue' : ''} ${itemSelecionado ? 'selecionada' : ''}" role="row" data-chave-selecao="${escHtml(chaveSelecao)}">
                <div class="linha-celula col-status" role="cell"><span class="pill-status ${classeStatus(item.status)}">${escHtml(item.status)}</span></div>
                <div class="linha-celula col-ordem" role="cell">${escHtml(item.ordem) || '-'}</div>
                <div class="linha-celula col-descricao" role="cell" title="${escHtml(item.descricao)}">${escHtml(item.descricao) || '-'}</div>

                <div class="linha-celula col-data" role="cell">${fmtDataBR(item.dataExecucao)}</div>

                <div class="linha-celula col-acao" role="cell">
                  <button class="botao-acao" type="button" onclick="abrirPainelOrdem(${indiceItem}, this)" aria-label="Abrir ações e detalhes da ordem ${escHtml(item.ordem)}">AÇÃO</button>
                </div>
                <div class="linha-celula col-selecao" role="cell">
                  <label class="selecao-alvo" title="${podeAlterarStatus ? 'Selecionar ordem ' + escHtml(item.ordem) : 'Status ENTREGUE é registrado exclusivamente pelo AutoMat Mobile'}">
                    <input class="checkbox-selecao checkbox-selecao-item" type="checkbox" data-chave="${escHtml(chaveSelecao)}" data-dia="${escHtml(data)}" onchange="alternarSelecaoItem(this)" aria-label="${podeAlterarStatus ? 'Selecionar ordem ' + escHtml(item.ordem) : 'Ordem entregue, status somente para consulta'}" ${itemSelecionado ? 'checked' : ''} ${podeAlterarStatus ? '' : 'disabled'}>
                  </label>
                </div>
              </article>
            `;
          }).join('')}
        </div>
      </section>
    `;
  }).join('');
  atualizarCheckboxesSelecao();
}

}

function baixarEvidenciaPainel(botao) {

// Atualiza os campos de gestão diretamente no item correspondente do Firebase.
async function salvarCampoFirebase(semanaChave, pushId, itemIdx, campo, valor) {
  const camposPermitidos = ['status','chamado','responsavel','situacaoEstoque','previsaoDisponibilidade','observacaoMaterial','prioridade','prazoNecessario','destinoAgrupamento','quantidadeSolicitada','quantidadePreparada','checklistConferido'];
  if (!camposPermitidos.includes(campo)) return;
  if (campo === 'status' && !STATUS_ALTERAVEIS_AUTOMAT.some(([status]) => status === valor)) return;

  const item = (_dadosPorSemana[semanaChave] || []).find(i => i._pushId === pushId && i._itemIdx === itemIdx);
  if (!item) return;
  if (campo === 'status' && item.status === 'ENTREGUE') return;
  const valorAnterior = item[campo];
  const separadoAnterior = item.separado;
  if (campo === 'quantidadeSolicitada' || campo === 'quantidadePreparada') valor = Math.max(0, Number(valor) || 0);
  if (campo === 'checklistConferido') valor = Boolean(valor);
  if (String(valorAnterior ?? '') === String(valor ?? '')) return;

  let justificativa = '';
  let acaoHistorico = 'MATERIAL_ATUALIZADO';
  if (campo === 'status') {
    const ordemStatus = ['SOLICITADO', 'EM PREPARAÇÃO', 'DESPACHADO'];
    const retornando = ordemStatus.indexOf(valor) < ordemStatus.indexOf(item.status);
    if (retornando) {
      justificativa = String(prompt('Informe a justificativa para corrigir o status desta ordem:') || '').trim();
      if (justificativa.length < 5) {
        alert('Para corrigir um status, informe uma justificativa com pelo menos 5 caracteres.');
        renderizarPainelOrdem();
        return;
      }
      acaoHistorico = 'CORRECAO_STATUS';
    } else {
      acaoHistorico = 'STATUS_ALTERADO';
    }
  }
  item[campo] = valor;

  const alteracoes = { [campo]: valor };
  const chaveHistorico = criarChaveRegistro();
  alteracoes[`historico/${chaveHistorico}`] = {
    acao: acaoHistorico,
    autorNome: item.responsavel || 'OPERADOR AUTOMAT',
    criadoEm: { '.sv': 'timestamp' },
    detalhes: { campo, valorAnterior: valorAnterior ?? null, valorNovo: valor, justificativa }
  };
  if (campo === 'status') {
    item.separado = valor === 'DESPACHADO';
    alteracoes.separado = item.separado;
  }

  mostrarStatusSalvamento('Salvando...');
  let salvou = false;

  try {
    const caminho = `/materiais/${semanaChave}/${pushId}/itens/${itemIdx}.json`;
    const resp = await _fetchFb(caminho, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(alteracoes)
    });
    if (!resp.ok) throw new Error('Status ' + resp.status);
    salvou = true;
    if (!item.historico || typeof item.historico !== 'object') item.historico = {};
    item.historico[chaveHistorico] = {
      acao: acaoHistorico,
      autorNome: item.responsavel || 'OPERADOR AUTOMAT',
      criadoEm: Date.now(),
      detalhes: { campo, valorAnterior: valorAnterior ?? null, valorNovo: valor, justificativa }
    };
    mostrarStatusSalvamento('Alteração salva na base de dados.', 'ok');
  } catch (err) {
    alert('Não foi possível salvar essa alteração. Tente novamente.\n\nDetalhe: ' + err.message);
    item[campo] = valorAnterior;
    item.separado = separadoAnterior;
    mostrarStatusSalvamento('Falha ao salvar a alteração.', 'erro');
  }

  if (campo === 'status') {
    
    popularFiltrosCascata();
    
    renderizarSemanaSelecionada();
  }
  if (_itemPainelAberto === item) renderizarPainelOrdem();
}

function criarChaveRegistro() {
  return 'r_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 9);
}

function mostrarStatusSalvamento(mensagem, tipo) {
  const el = document.getElementById('status-salvamento');
  if (!el) return;
  el.textContent = mensagem;
  el.className = 'status-salvamento' + (tipo ? ' ' + tipo : '');
  clearTimeout(el._limpar);
  el._limpar = setTimeout(() => { el.textContent = ''; el.className = 'status-salvamento'; }, 3000);
}

async function baixarEvidenciaEntrega(semanaChave, pushId, itemIdx, botao) {
  const item = (_dadosPorSemana[semanaChave] || []).find(i => i._pushId === pushId && i._itemIdx === itemIdx);
  if (!item || !item.possuiEvidenciaEntrega) return;
  const textoOriginal = botao.innerHTML;
  botao.disabled = true;
  botao.textContent = 'Baixando...';
  try {
    let evidencia = item.evidenciaEntrega || null;
    if (!evidencia) {
      const caminho = `/entregas/${semanaChave}/${pushId}/${itemIdx}/evidencia.json`;
      const resp = await _fetchFb(caminho, { cache: 'no-store' });
      if (!resp.ok) throw new Error('Status ' + resp.status);
      evidencia = await resp.json();
    }
    if (!evidencia || !/^data:image\/(?:jpeg|png|webp);base64,/i.test(String(evidencia.dataUrl || ''))) {
      throw new Error('Anexo inválido');
    }
    const respostaArquivo = await fetch(evidencia.dataUrl);
    const blob = await respostaArquivo.blob();
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = nomeArquivoSeguro(evidencia.nome || `evidencia-ordem-${item.ordem}.jpg`);
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
    mostrarStatusSalvamento('Evidência baixada.', 'ok');
  } catch (err) {
    alert('Não foi possível baixar a evidência desta entrega.');
    mostrarStatusSalvamento('Falha ao baixar a evidência.', 'erro');
  } finally {
    botao.disabled = false;
    botao.innerHTML = textoOriginal;
  }
}

function nomeArquivoSeguro(nome) {
  const limpo = String(nome || 'evidencia.jpg').replace(/[^a-zA-Z0-9._-]+/g, '-').replace(/^-+|-+$/g, '');
  return limpo || 'evidencia.jpg';
}

function escHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function compararVersoesAutomat(a, b) {
  const numeros = valor => String(valor || '').replace(/^[vV]/, '').split('.').map(parte => parseInt(parte, 10) || 0);
  const versaoA = numeros(a);
  const versaoB = numeros(b);
  const tamanho = Math.max(versaoA.length, versaoB.length);
  for (let indice = 0; indice < tamanho; indice++) {
    const diferenca = (versaoA[indice] || 0) - (versaoB[indice] || 0);
    if (diferenca) return diferenca;
  }
  return 0;
}

async function verificarAtualizacaoAutomat() {
  const controlador = new AbortController();
  const limite = setTimeout(() => controlador.abort(), 5000);
  try {
    const resposta = await fetch(AUTOMAT_VERSION_CHECK_URL, { cache: 'no-store', signal: controlador.signal });
    if (!resposta.ok) return;
    const dados = await resposta.json();
    if (dados && dados.versao && compararVersoesAutomat(dados.versao, AUTOMAT_APP_VERSION) > 0) {
      mostrarAtualizacaoAutomat(dados.versao, dados.novidades);
    }
  } catch (_) {
    // Sem conexão ou repositório indisponível: o módulo continua normalmente.
  } finally {
    clearTimeout(limite);
  }
}

function mostrarAtualizacaoAutomat(novaVersao, novidades) {
  if (document.getElementById('automat-update-overlay')) return;
  const lista = Array.isArray(novidades) && novidades.length
    ? '<div style="margin:14px 0;padding:12px 14px;border-radius:12px;background:#F2F5F6;text-align:left;"><strong style="display:block;margin-bottom:6px;color:#007E7A;font-size:12.5px;">Novidades</strong><ul style="max-height:180px;margin:0;padding-left:18px;overflow:auto;color:#555;font-size:11.5px;line-height:1.5;">' + novidades.map(item => '<li style="margin-bottom:4px;">' + escHtml(item) + '</li>').join('') + '</ul></div>'
    : '';
  const overlay = document.createElement('div');
  overlay.id = 'automat-update-overlay';
  overlay.style.cssText = 'position:fixed;inset:0;z-index:999999;padding:18px;display:flex;align-items:center;justify-content:center;background:rgba(10,25,29,.85);backdrop-filter:blur(6px);';
  overlay.innerHTML = '<div role="dialog" aria-modal="true" aria-labelledby="automat-update-title" style="width:440px;max-width:100%;padding:30px 26px;border-radius:18px;background:#fff;box-shadow:0 22px 65px rgba(0,0,0,.4);text-align:center;font-family:inherit;">'
    + '<div style="width:54px;height:54px;margin:0 auto 14px;border-radius:16px;display:grid;place-items:center;color:#007E7A;background:#DDF3F1;font-size:28px;">↻</div>'
    + '<h2 id="automat-update-title" style="margin:0 0 8px;color:#182126;font-size:20px;">Nova versão disponível</h2>'
    + '<p style="margin:0;color:#657177;font-size:13px;line-height:1.55;">Sua versão: <strong>' + escHtml(AUTOMAT_APP_VERSION) + '</strong><br>Nova versão: <strong>' + escHtml(novaVersao) + '</strong></p>'
    + '<p style="margin:12px 0;padding:10px 12px;border-radius:8px;background:#FDE8EE;color:#C0305E;font-size:12.5px;font-weight:700;line-height:1.4;">É obrigatório atualizar para continuar usando o AutoMat.</p>'
    + lista
    + '<button type="button" onclick="baixarAtualizacaoAutomat()" style="width:100%;min-height:50px;border:0;border-radius:12px;color:#fff;background:#007E7A;font:700 14px inherit;cursor:pointer;">BAIXAR E SALVAR NOVA VERSÃO</button>'
    + '<p id="automat-update-status" style="min-height:18px;margin:12px 0 0;color:#89949A;font-size:11.5px;">Salve sobre o mesmo arquivo AUTOMAT.html antigo para substituí-lo.</p>'
    + '</div>';
  document.body.appendChild(overlay);
  document.body.style.overflow = 'hidden';
}

async function baixarAtualizacaoAutomat() {
  const botao = document.querySelector('#automat-update-overlay button');
  const status = document.getElementById('automat-update-status');
  const textoOriginal = botao ? botao.textContent : '';
  try {
    if (botao) { botao.disabled = true; botao.textContent = 'BAIXANDO...'; }
    const resposta = await fetch(AUTOMAT_DOWNLOAD_URL, { cache: 'no-store' });
    if (!resposta.ok) throw new Error('Status ' + resposta.status);
    const arquivo = await resposta.blob();
    if (window.showSaveFilePicker) {
      const destino = await window.showSaveFilePicker({
        suggestedName: 'AUTOMAT.html',
        types: [{ description: 'Arquivo HTML', accept: { 'text/html': ['.html'] } }]
      });
      const gravacao = await destino.createWritable();
      await gravacao.write(arquivo);
      await gravacao.close();
      if (status) status.textContent = 'Nova versão salva. Feche este arquivo e abra o AUTOMAT.html atualizado.';
    } else {
      const url = URL.createObjectURL(arquivo);
      const link = document.createElement('a');
      link.href = url;
      link.download = 'AUTOMAT.html';
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
      if (status) status.textContent = 'Download iniciado. Substitua o arquivo antigo pelo novo.';
    }
  } catch (erro) {
    if (erro && erro.name !== 'AbortError' && status) status.textContent = 'Não foi possível baixar a atualização. Tente novamente.';
  } finally {
    if (botao) { botao.disabled = false; botao.textContent = textoOriginal; }
  }
}

function inicializarControleVersaoAutomat() {
  const rodape = document.getElementById('automat-versao-rodape');
  if (rodape) rodape.textContent = '- ' + AUTOMAT_APP_VERSION;
  setTimeout(verificarAtualizacaoAutomat, 300);
}

// ── Autenticação Centralizada Facilita PCM ───────────────────────────
const _FACILITA_API = /^https?:$/.test(window.location.protocol)
  ? window.location.origin
  : 'https://black-meadow-0dc500c10.5.azurestaticapps.net';
const _AUTH_STORAGE_KEY_AUTOMAT = '_facilita_auth_automat';

function _opcoesPostAutomat(payload) {
  const local = window.location.protocol === 'file:';
  return {
    method: 'POST',
    headers: local
      ? { 'Content-Type': 'text/plain;charset=UTF-8' }
      : { 'Content-Type': 'application/json', 'X-Facilita-Client': 'AUTOMAT' },
    body: JSON.stringify(payload)
  };
}

function _obterAuthAutomat() {
  try {
    const raw = localStorage.getItem(_AUTH_STORAGE_KEY_AUTOMAT);
    return raw ? JSON.parse(raw) : null;
  } catch (_) {
    return null;
  }
}

function _salvarAuthAutomat(dados) {
  try {
    localStorage.setItem(_AUTH_STORAGE_KEY_AUTOMAT, JSON.stringify(dados));
  } catch (_) {}
}

function _limparAuthAutomat() {
  try {
    localStorage.removeItem(_AUTH_STORAGE_KEY_AUTOMAT);
  } catch (_) {}
}

function _exibirUsuarioConectadoAutomat(usuario) {
  const container = document.getElementById('automat-usuario-sessao');
  const nomeEl = document.getElementById('automat-usuario-nome');
  if (container && nomeEl && usuario) {
    nomeEl.textContent = usuario.nome || usuario.usuario || 'Usuário';
    container.style.display = 'inline';
  }
}

function _exibirAppAutomat(usuario) {
  const loginScreen = document.getElementById('login-screen');
  const appEl = document.querySelector('.app-automat');
  if (loginScreen) loginScreen.style.display = 'none';
  if (appEl) appEl.style.display = 'flex';
  if (usuario) {
      _exibirUsuarioConectadoAutomat(usuario);
      if (!window._filtrosIniciaisAplicadosAutomat) {
        if (usuario.planta) _plantaAtual = normalizarTextoFiltro(usuario.planta);
        if (usuario.pcm) _pcmAtual = normalizarTextoFiltro(usuario.pcm);
        window._filtrosIniciaisAplicadosAutomat = true;
      }
    }
}

function _exibirLoginAutomat(msgErro) {
  const loginScreen = document.getElementById('login-screen');
  const appEl = document.querySelector('.app-automat');
  if (appEl) appEl.style.display = 'none';
  if (loginScreen) loginScreen.style.display = 'flex';
  const errEl = document.getElementById('login-error');
  if (errEl) errEl.textContent = msgErro || '';
  setTimeout(() => {
    const userInput = document.getElementById('login-usuario');
    if (userInput) userInput.focus();
  }, 100);
}

function _alternarVisibilidadeSenhaAutomat() {
  const input = document.getElementById('login-input');
  const btn = document.getElementById('btn-toggle-senha');
  if (!input) return;
  const iconEye = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:block;"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
  const iconEyeOff = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:block;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
  if (input.type === 'password') {
    input.type = 'text';
    if (btn) btn.innerHTML = iconEyeOff;
  } else {
    input.type = 'password';
    if (btn) btn.innerHTML = iconEye;
  }
}

async function _executarLoginAutomat() {
  const userInput = document.getElementById('login-usuario');
  const passInput = document.getElementById('login-input');
  const btnEntrar = document.getElementById('btn-login-entrar');
  const errEl = document.getElementById('login-error');
  const usuario = String(userInput ? userInput.value : '').trim().toLowerCase();
  const senha = String(passInput ? passInput.value : '').trim();

  if (!usuario || !senha) {
    if (errEl) errEl.textContent = 'Informe usuário e senha.';
    return;
  }

  const textoOriginal = btnEntrar ? btnEntrar.textContent : 'Entrar';
  if (btnEntrar) { btnEntrar.disabled = true; btnEntrar.textContent = 'Entrando...'; }
  if (errEl) errEl.textContent = '';

  try {
    const resp = await fetch(
      `${_FACILITA_API}/api/auth/login`,
      _opcoesPostAutomat({ usuario, senha, modulo: 'AUTOMAT' })
    );

    const data = await resp.json().catch(() => ({}));
    if (!resp.ok || !data.ok) {
      const msg = data.error || (resp.status === 401 ? 'Usuário ou senha inválidos.' : (resp.status === 403 ? 'Seu perfil não possui acesso ao AutoMat.' : 'Não foi possível autenticar. Verifique sua conexão.'));
      if (errEl) errEl.textContent = msg;
      return;
    }

    _salvarAuthAutomat(data);
    _exibirAppAutomat(data.usuario);
    carregarDados();
  } catch (err) {
    if (errEl) errEl.textContent = 'Erro de comunicação com o servidor de autenticação. Verifique sua conexão.';
  } finally {
    if (btnEntrar) { btnEntrar.disabled = false; btnEntrar.textContent = textoOriginal; }
  }
}

async function _verificarSessaoAutomat() {
  const auth = _obterAuthAutomat();
  if (!auth || !auth.autenticacao || !auth.autenticacao.token) {
    _exibirLoginAutomat();
    return;
  }

  if (auth.autenticacao.expiraEm && auth.autenticacao.expiraEm > Date.now() + 60000) {
    _exibirAppAutomat(auth.usuario);
    carregarDados();
    return;
  }

  if (auth.autenticacao.refreshToken) {
    try {
      const resp = await fetch(
        `${_FACILITA_API}/api/auth/refresh`,
        _opcoesPostAutomat({ refreshToken: auth.autenticacao.refreshToken, modulo: 'AUTOMAT' })
      );
      const data = await resp.json().catch(() => ({}));
      if (resp.ok && data.ok) {
        _salvarAuthAutomat(data);
        _exibirAppAutomat(data.usuario);
        carregarDados();
        return;
      }
    } catch (_) {}
  }

  _limparAuthAutomat();
  _exibirLoginAutomat('Sua sessão expirou. Digite suas credenciais novamente.');
}

function _logoutAutomat() {
  _limparAuthAutomat();
  window.location.reload();
}

inicializarControleVersaoAutomat();
_verificarSessaoAutomat();
</script>
