name: Validar versão do AutoProg

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Conferir páginas de transição e versões obrigatórias
        run: node scripts/verificar-versao-autoprog.js
